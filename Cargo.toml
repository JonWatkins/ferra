[package]
name = "ferra"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
encoding_rs = "0.8.44"
ignore = "0.4.34"
libloading = "0.9.1"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
toml = "1.2.0"
toml_edit = "0.25.19"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-md = "0.5.4"
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[features]
# The grammars that used to be built in, now language packs: ferra's own
# tests still use them (turned on for tests by the dev-dependency below).
test-languages = [
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
]

[dev-dependencies]
ferra = { path = ".", features = ["test-languages"] }
tempfile = "3.27.0"
# The reference the highlighter is checked against.
tree-sitter-highlight = "0.27.1"

# Dependencies (tree-sitter and its grammars, ratatui, serde_json) are
# built optimized even in debug builds: they do most of the work of a
# frame, and unoptimized they make typing lag. ferra's own code stays
# quick to build and debug.
[profile.dev.package."*"]
opt-level = 3
