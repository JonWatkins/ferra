[package]
name = "terminal-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ignore = "0.4.34"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
