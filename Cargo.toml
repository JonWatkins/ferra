[package]
name = "ferra"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
encoding_rs = "0.8.44"
ignore = "0.4.34"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2.3"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
# The reference the highlighter is checked against.
tree-sitter-highlight = "0.27.1"

# Dependencies (tree-sitter and its grammars, ratatui, serde_json) are
# built optimized even in debug builds: they do most of the work of a
# frame, and unoptimized they make typing lag. ferra's own code stays
# quick to build and debug.
[profile.dev.package."*"]
opt-level = 3
