# Vim's keys (keymap = "vim"): its editing modes. Laid over the keys every
# keymap shares (the sidebar, pickers, popups, the find box, the git view,
# the settings editor, the terminal panel and the : line), which are in
# default.toml's [keys]. Your [keys] in config.toml go over all of it.
#
# Notation: "x", "gg", "<C-x>", "<A-x>", "<S-Tab>", "<Esc>", "<CR>", "<BS>",
# "<Del>", "<Tab>", "<Space>", "<lt>", "<Left>", "<Home>", "<PageUp>", "<F1>".
#
# Motions are shared by [keys.normal] (move the cursor) and [keys.operator]
# (the range for d/c/y). A register can be selected with "x before a command.

[keys.normal]
# The menu bar: F10 opens it, Alt and a menu's letter opens that menu
# (on a Mac, ⌥ and the letter: the characters ⌥ types count too, so it
# works without setting the terminal to send ⌥ as Alt).
"<F10>" = "menu_open"
"<A-f>" = "menu_file"
"ƒ" = "menu_file"
