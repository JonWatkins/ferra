# Default configuration.
#
# This file is embedded in the binary. Your own config file (see README) is
# merged on top of it, so you only need to specify what you want to change.

[editor]
# Width of a tab stop, and of one indent level.
tab-width = 4
# Indent with spaces (true) or tab characters (false).
expand-tab = true
# Indent a file the way it's already indented (tabs, or 2, 3, 4... spaces),
# looking at its first 1000 lines when it's opened. Files with nothing
# indented yet use expand-tab and tab-width. :indent overrides it per buffer.
detect-indent = true
# Enter, o and O indent the new line: by the language's rules where it has
# them, otherwise like the line before (one level more after an opening
# bracket). Typing a closing bracket first on a line re-indents it, as do
# keywords like Bash's fi and Python's else:.
auto-indent = true
# "absolute", "relative" (hybrid: current line shows its absolute number) or "none".
line-numbers = "relative"
# The width gq and gw reflow text to (per buffer with :setlocal tw=72).
text-width = 79
# Typing past text-width breaks the line, keeping its indentation and
# comment marker: "off", "comments" (only in comments, for code) or "all"
# (for prose). Per language: options = { auto-wrap = "all" }.
auto-wrap = "off"
# Long lines continue on the next screen rows, breaking between words, and
# gj/gk move by screen rows. false scrolls sideways instead.
wrap = true
# A wrapped line's later rows start at its indentation, after this marker
# ("" for none).
wrap-indent = true
wrap-marker = "↪ "
# Highlight the line the cursor is on.
cursorline = true
# "windows": a status line under every window, the active one highlighted
# (Neovim's default). "global": one status line at the bottom.
statusline = "windows"
# Minimum lines kept visible above/below the cursor when scrolling.
scroll-off = 5
# Colour code with tree-sitter (the languages in [languages] below).
syntax-highlighting = true
# Ask the terminal for the kitty keyboard protocol where it has it (kitty,
# WezTerm, foot, Ghostty, Alacritty, recent iTerm2). Keys then arrive
# unambiguously: a quick Esc then j is never taken for a bound <A-j>, and
# <C-i>, <C-m> can be bound apart from <Tab>, <CR> (unbound, they act as
# those; <C-[> is always <Esc>). Other terminals work as before.
kitty-keyboard = true
# Milliseconds to wait for the next key of a sequence before giving up: a
# half-typed insert-mode binding (the j of jk) is typed as text, and a key
# bound on its own and as a prefix (g and gg) runs the shorter binding.
# 0 waits forever.
key-timeout = 1000
# The system clipboard: "registers" (only "+ and "* use it), "unnamed"
# (every yank and delete goes to it, and p pastes from it) or "off".
clipboard = "registers"
# Which clipboard that is: "system", "terminal" (your terminal's, set with
# an OSC 52 escape sequence: it works over SSH, and in tmux with
# `set -g set-clipboard on`) or "auto" (the system clipboard, but the
# terminal's over SSH or when there's no system clipboard). The terminal's
# clipboard can only be copied to; paste from it with your terminal.
clipboard-provider = "auto"
# The encoding for files that aren't UTF-8 and have no byte-order mark (any
# WHATWG label: "windows-1252", "latin1", "shift_jis", "gbk"...). Files are
# saved back in the encoding they were read in. "utf-8" refuses other files.
fallback-encoding = "windows-1252"
# Start the language server set for a file's language (language-server in
# [languages] below) when it's opened: diagnostics in the text, ]d and [d.
lsp = true
# Check open files for changes made by other programs (a formatter, git, a
# tool editing alongside you) every second while you're idle in normal mode,
# not only when the terminal regains focus. Unmodified buffers reload (u
# brings back what was there); modified ones get a warning.
watch-files = true

# What the active window's status line shows, left, center and right.
# Elements: mode, file-name, file-base-name, modified, position,
# position-percentage, total-lines, file-type, file-encoding (only when not
# plain UTF-8), file-line-ending, indent ("2 spaces", "tabs"), diagnostics
# (language server errors and warnings: E2 W1), pending-keys,
# recording, separator, spacer.
[editor.statusline-layout]
left = ["mode", "file-name", "modified"]
center = []
right = ["recording", "pending-keys", "diagnostics", "file-encoding", "file-type", "position"]

[editor.search]
# "smart" (case-insensitive unless the pattern has a capital), "sensitive"
# or "insensitive".
case = "smart"
# Keep matches of the last search highlighted, until :noh.
highlight = true
# Searches wrap around the end of the file.
wrap = true

[editor.file-picker]
# <Space>f lists files under the current directory.
hidden = false
git-ignore = true
max-files = 20000

[editor.cursor-shape]
# "block", "bar" or "underline".
normal = "block"
insert = "bar"
command = "bar"
picker = "bar"
# While an operator (d, c, y) waits for a motion.
operator = "underline"
visual = "block"
# Replace mode (R).
replace = "underline"

# Which files are in which language, for syntax highlighting. Files are
# matched by exact file name, then extension, then the interpreter on a
# `#!` first line (`python` also matches `python3.12`). Add your own:
#
#   [languages.bash]
#   file-names = [".bashrc", "my-script"]
#
# `comment` (or `block-comment` for languages without line comments) is what
# gc uses to comment lines out. `options` sets tab-width, expand-tab,
# auto-indent or text-width for the language's buffers (:setlocal still wins):
#
#   [languages.python]
#   options = { tab-width = 4, text-width = 88 }
#
# A language without a built-in grammar (make, git-commit) isn't
# highlighted, but is still recognised for comments and options.
#
# `language-server` is the language server for its files: a command found on
# PATH, its arguments, and the files that mark a project's root (the nearest
# one above the file; otherwise its own directory). Servers aren't installed
# for you: one that isn't found is reported once, and :lsp lists them all.
# `settings` are the server's own settings, sent as it starts. Turn one off
# with `language-server = { enabled = false }`.
[languages.rust]
extensions = ["rs"]
comment = "//"
language-server = { command = "rust-analyzer", roots = ["Cargo.toml"] }

[languages.toml]
extensions = ["toml"]
file-names = ["Cargo.lock", "Pipfile"]
comment = "#"
language-server = { command = "taplo", args = ["lsp", "stdio"] }

[languages.json]
extensions = ["json", "jsonc"]
file-names = [".prettierrc", ".eslintrc"]
language-server = { command = "vscode-json-language-server", args = ["--stdio"], settings = { json = { validate = { enable = true } } } }

[languages.python]
extensions = ["py", "pyi"]
shebangs = ["python"]
comment = "#"
language-server = { command = "pyright-langserver", args = ["--stdio"], roots = ["pyproject.toml", "setup.py", "requirements.txt"] }

[languages.javascript]
extensions = ["js", "mjs", "cjs", "jsx"]
shebangs = ["node"]
comment = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"], roots = ["package.json", "tsconfig.json", "jsconfig.json"] }

[languages.typescript]
extensions = ["ts", "mts", "cts"]
shebangs = ["deno", "ts-node"]
comment = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"], roots = ["package.json", "tsconfig.json"] }

[languages.tsx]
extensions = ["tsx"]
comment = "//"
language-server = { command = "typescript-language-server", args = ["--stdio"], roots = ["package.json", "tsconfig.json"], language-id = "typescriptreact" }

[languages.go]
extensions = ["go"]
comment = "//"
options = { expand-tab = false }
language-server = { command = "gopls", roots = ["go.mod", "go.work"] }

[languages.make]
extensions = ["mk"]
file-names = ["Makefile", "makefile", "GNUmakefile"]
comment = "#"
# Recipes must start with a tab.
options = { expand-tab = false }

[languages.git-commit]
file-names = ["COMMIT_EDITMSG", "MERGE_MSG", "TAG_EDITMSG"]
comment = "#"
options = { text-width = 72, auto-wrap = "all" }

[languages.c]
extensions = ["c", "h"]
comment = "//"
language-server = { command = "clangd", roots = ["compile_commands.json", "CMakeLists.txt", ".clangd"] }

[languages.cpp]
extensions = ["cpp", "cc", "cxx", "c++", "hpp", "hh", "hxx", "h++"]
comment = "//"
language-server = { command = "clangd", roots = ["compile_commands.json", "CMakeLists.txt", ".clangd"] }

[languages.bash]
extensions = ["sh", "bash", "zsh"]
file-names = [".bashrc", ".bash_profile", ".bash_aliases", ".profile", ".zshrc", ".zprofile", ".zshenv", "PKGBUILD"]
shebangs = ["sh", "bash", "zsh", "dash"]
comment = "#"
language-server = { command = "bash-language-server", args = ["start"], language-id = "shellscript" }

[languages.markdown]
extensions = ["md", "markdown"]
block-comment = ["<!--", "-->"]
language-server = { command = "marksman", args = ["server"] }

[languages.yaml]
extensions = ["yaml", "yml"]
file-names = [".clang-format"]
comment = "#"
language-server = { command = "yaml-language-server", args = ["--stdio"] }

[languages.html]
extensions = ["html", "htm"]
block-comment = ["<!--", "-->"]
language-server = { command = "vscode-html-language-server", args = ["--stdio"] }

[languages.css]
extensions = ["css"]
block-comment = ["/*", "*/"]
language-server = { command = "vscode-css-language-server", args = ["--stdio"] }

# Theme styles are keyed by scope. Lookups fall back to the parent scope, so
# "ui.linenr.selected" falls back to "ui.linenr".
#
# A style is either a foreground colour string, or a table with optional
# `fg`, `bg` and `modifiers` (bold, italic, dim, underlined, reversed, crossed_out).
# Colours may be hex ("#rrggbb"), names ("red", "lightblue") or indices ("42").
[theme]
"ui.background" = { bg = "#16181d" }
"ui.text" = "#d4d7dd"
"ui.cursorline" = { bg = "#1f2229" }
"ui.selection" = { bg = "#33467c" }
"ui.search.match" = { fg = "#16181d", bg = "#e0af68" }

# Syntax highlighting. Scopes fall back to their parent, so "function.method"
# uses "function" unless it's set itself.
"keyword" = "#bb9af7"
"function" = "#7aa2f7"
"function.macro" = "#7dcfff"
"type" = "#2ac3de"
"constructor" = "#2ac3de"
"module" = "#7aa2f7"
"string" = "#9ece6a"
"escape" = "#7dcfff"
"comment" = { fg = "#565f89", modifiers = ["italic"] }
"constant" = "#ff9e64"
"number" = "#ff9e64"
"boolean" = "#ff9e64"
"variable.builtin" = "#f7768e"
"variable.parameter" = "#e0af68"
"property" = "#73daca"
"attribute" = "#e0af68"
"label" = "#7dcfff"
"tag" = "#f7768e"
"operator" = "#89ddff"
"punctuation" = "#9aa5ce"
# Markdown and other prose.
"text.title" = { fg = "#7aa2f7", modifiers = ["bold"] }
"text.strong" = { modifiers = ["bold"] }
"text.emphasis" = { modifiers = ["italic"] }
"text.literal" = "#9ece6a"
"text.uri" = { fg = "#7dcfff", modifiers = ["underlined"] }
"text.reference" = "#7dcfff"
"ui.window.separator" = "#3b4048"
# The splash screen shown when starting without a file.
"ui.splash.logo" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.splash.version" = "#565f89"
"ui.splash.key" = "#e0af68"
"ui.splash.text" = "#a9b1d6"
"ui.fold" = { fg = "#6b7280", modifiers = ["italic"] }
# Diagnostics from language servers: underlines in the text, the line
# number, and the message after the line.
"diagnostic.error" = { underline = "#f7768e", modifiers = ["underlined"] }
"diagnostic.warning" = { underline = "#e0af68", modifiers = ["underlined"] }
"diagnostic.info" = { underline = "#7aa2f7", modifiers = ["underlined"] }
"diagnostic.hint" = { underline = "#6b7280", modifiers = ["underlined"] }
"ui.diagnostic.error" = "#f7768e"
"ui.diagnostic.warning" = "#e0af68"
"ui.diagnostic.info" = "#7aa2f7"
"ui.diagnostic.hint" = "#6b7280"
"ui.statusline.diagnostic.error" = { fg = "#f7768e", modifiers = ["bold"] }
"ui.statusline.diagnostic.warning" = { fg = "#e0af68", modifiers = ["bold"] }
"ui.wrap-marker" = "#4b5263"
"ui.popup" = { fg = "#d4d7dd", bg = "#1f2229" }
"ui.popup.border" = "#4b5263"
"ui.popup.title" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.popup.prompt" = "#7aa2f7"
"ui.popup.selected" = { bg = "#33467c" }
"ui.popup.match" = { fg = "#e0af68", modifiers = ["bold"] }
"ui.popup.detail" = "#6b7280"
"ui.linenr" = "#4b5263"
"ui.linenr.selected" = { fg = "#c9ccd3", modifiers = ["bold"] }
"ui.statusline" = { fg = "#a0a6b0", bg = "#1f2229" }
"ui.statusline.normal" = { fg = "#16181d", bg = "#7aa2f7", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#16181d", bg = "#9ece6a", modifiers = ["bold"] }
"ui.statusline.replace" = { fg = "#16181d", bg = "#f7768e", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "#16181d", bg = "#e0af68", modifiers = ["bold"] }
"ui.statusline.operator" = { fg = "#16181d", bg = "#7aa2f7", modifiers = ["bold"] }
"ui.statusline.visual" = { fg = "#16181d", bg = "#bb9af7", modifiers = ["bold"] }
"ui.statusline.picker" = { fg = "#16181d", bg = "#7dcfff", modifiers = ["bold"] }
"ui.statusline.pending" = { fg = "#e0af68", bg = "#1f2229" }
"ui.statusline.recording" = { fg = "#f7768e", bg = "#1f2229", modifiers = ["bold"] }
"ui.statusline.modified" = { fg = "#e0af68", bg = "#1f2229", modifiers = ["bold"] }
# The status lines of windows other than the active one.
"ui.statusline.inactive" = { fg = "#6b7089", bg = "#1a1c22" }
"ui.command-line" = "#d4d7dd"
"ui.message.info" = "#a0a6b0"
"ui.message.error" = { fg = "#f7768e", modifiers = ["bold"] }

# Keybindings: "<keys>" = "<command name>". Bind to "" to remove a default.
# Notation: "x", "gg", "<C-x>", "<A-x>", "<S-Tab>", "<Esc>", "<CR>", "<BS>",
# "<Del>", "<Tab>", "<Space>", "<lt>", "<Left>", "<Home>", "<PageUp>", "<F1>".
#
# Motions are shared by [keys.normal] (move the cursor) and [keys.operator]
# (the range for d/c/y). A register can be selected with "x before a command.
[keys.normal]
"<Esc>" = "clear_search_highlight"
"<C-v>" = "visual_block_mode"
"h" = "move_left"
"j" = "move_down"
"k" = "move_up"
"l" = "move_right"
"<Left>" = "move_left"
"<Down>" = "move_down"
"<Up>" = "move_up"
"<Right>" = "move_right"
"w" = "move_word_forward"
"b" = "move_word_backward"
"e" = "move_word_end"
"0" = "goto_line_start"
"^" = "goto_first_non_blank"
"$" = "goto_line_end"
"<Home>" = "goto_line_start"
"<End>" = "goto_line_end"
"gg" = "goto_file_start"
"G" = "goto_file_end"
"f" = "find_char_forward"
"t" = "till_char_forward"
"F" = "find_char_backward"
"T" = "till_char_backward"
";" = "repeat_char_search"
"," = "repeat_char_search_reverse"
"%" = "goto_matching_bracket"
