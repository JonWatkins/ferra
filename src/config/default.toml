"A" = "tree_new_folder"
"<F2>" = "tree_rename"
"m" = "tree_rename"
"d" = "tree_trash"
"<Del>" = "tree_trash"
"y" = "tree_copy_relative_path"
"Y" = "tree_copy_path"
"/" = "search_query"
"r" = "search_replace_selected"
"<Tab>" = "sidebar_next_view"
"<S-Tab>" = "sidebar_prev_view"
"q" = "sidebar_toggle"
"<C-A-b>" = "agent_sidebar"
"<Esc>" = "sidebar_focus"
"<Space>e" = "sidebar_focus"
":" = "command_mode"
"<Space>f" = "file_picker"
"<Space>b" = "buffer_picker"
"<Space>p" = "command_palette"

