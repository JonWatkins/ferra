"ui.sidebar.marker" = "#6b7280"
"ui.sidebar.folder" = "#c0caf5"
"ui.sidebar.file" = "#a9b1d6"
"ui.sidebar.current" = { fg = "#7dcfff", modifiers = ["bold"] }
"ui.sidebar.selected" = { bg = "#33467c" }
"ui.sidebar.modified" = "#e0af68"
"ui.sidebar.empty" = { fg = "#6b7280", modifiers = ["italic"] }
