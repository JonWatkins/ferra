# Keybindings: "<keys>" = "<command name>". Bind to "" to remove a default.
# Notation: "x", "gg", "<C-x>", "<A-x>", "<S-Tab>", "<Esc>", "<CR>", "<BS>",
# "<Del>", "<Tab>", "<Space>", "<lt>", "<Left>", "<Home>", "<PageUp>", "<F1>".
#
# Motions are shared by [keys.normal] (move the cursor) and [keys.operator]
# (the range for d/c/y). A register can be selected with "x before a command.

[keys.normal]
"<Esc>" = "clear_search_highlight"
"<C-v>" = "visual_block_mode"
"h" = "move_left"
"j" = "move_down"
"k" = "move_up"
"l" = "move_right"
"<Left>" = "move_left"
"<Down>" = "move_down"
"<Up>" = "move_up"
"<Right>" = "move_right"
"w" = "move_word_forward"
"b" = "move_word_backward"
"e" = "move_word_end"
"0" = "goto_line_start"
"^" = "goto_first_non_blank"
"$" = "goto_line_end"
"<Home>" = "goto_line_start"
"<End>" = "goto_line_end"
"gg" = "goto_file_start"
"G" = "goto_file_end"
"f" = "find_char_forward"
