# Keybindings: "<keys>" = "<command name>". Bind to "" to remove a default.
# These are the keys every keymap shares; the editing modes' (normal,
# insert, visual...) are the chosen keymap's: keymaps/vim.toml or
# keymaps/vscode.toml.
#
# Notation: "x", "gg", "<C-x>", "<A-x>", "<S-Tab>", "<Esc>", "<CR>", "<BS>",
# "<Del>", "<Tab>", "<Space>", "<lt>", "<Left>", "<Home>", "<PageUp>", "<F1>".

# The sidebar's file tree (<Space>e), while it has focus.
[keys.sidebar]
"<F10>" = "menu_open"
"<A-f>" = "menu_file"
"ƒ" = "menu_file"
"<A-d>" = "menu_edit"
"∂" = "menu_edit"
"<A-v>" = "menu_view"
"√" = "menu_view"
"<A-o>" = "menu_go"
"ø" = "menu_go"
"<A-g>" = "menu_git"
"©" = "menu_git"
"<A-t>" = "menu_terminal"
"†" = "menu_terminal"
"<A-a>" = "menu_agent"
"å" = "menu_agent"
"<A-h>" = "menu_help"
"˙" = "menu_help"
"j" = "sidebar_down"
"k" = "sidebar_up"
"<Down>" = "sidebar_down"
"<Up>" = "sidebar_up"
"gg" = "sidebar_first"
"G" = "sidebar_last"
"<CR>" = "sidebar_choose"
"l" = "sidebar_expand"
"<Right>" = "sidebar_expand"
"h" = "sidebar_collapse"
"<Left>" = "sidebar_collapse"
"zM" = "sidebar_collapse_all"
"R" = "sidebar_refresh"
