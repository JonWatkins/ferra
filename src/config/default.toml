"." = "repeat_last_change"
":" = "command_mode"
"/" = "search_forward"
"?" = "search_backward"
"n" = "search_next"
"N" = "search_prev"
"*" = "search_word_forward"
"#" = "search_word_backward"
"v" = "visual_mode"
