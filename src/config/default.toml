# Default configuration.
#
# This file is embedded in the binary. Your own config file (see README.md) is
# merged on top of it, so you only need to specify what you want to change.

[editor]
# The keys: "vscode" (no modes: you're always typing, as in VS Code: Ctrl+S
# saves, Ctrl+F finds, Ctrl+P opens a file, Shift and the arrows select,
# Ctrl+C, Ctrl+X and Ctrl+V copy, cut and paste) or "vim" (Vim's modes:
# normal, insert, visual...). Your own [keys] go over either.
keymap = "vscode"
# Width of a tab stop, and of one indent level unless shift-width says.
tab-width = 4
# Width of one indent level (>>, Tab, new lines...), as Vim's shiftwidth; 0
# means tab-width. Narrower than tab-width with expand-tab = false, levels
# are tabs then spaces: tab-width = 8 and shift-width = 4 indent with 4
# spaces, a tab, a tab and 4 spaces...
shift-width = 0
# Indent with spaces (true) or tab characters (false).
expand-tab = true
# Indent a file the way it's already indented (tabs, or 2, 3, 4... spaces),
# looking at its first 1000 lines when it's opened. Files with nothing
# indented yet use expand-tab and shift-width. :indent overrides it per buffer.
detect-indent = true
# Enter, o and O indent the new line: by the language's rules where it has
# them, otherwise like the line before (one level more after an opening
# bracket). Typing a closing bracket first on a line re-indents it, as do
# keywords like Bash's fi and Python's else:.
auto-indent = true
# Typing an opening bracket or quote puts in its closer after the cursor
# (before a space, the line's end or a closing bracket; a quote not after a
# letter), typing the closer then steps over it, and Backspace between an
# empty pair takes both. With VS Code's keys, typing one over a selection
# wraps it.
auto-pairs = true
# "absolute", "relative" (hybrid: current line shows its absolute number) or "none".
line-numbers = "relative"
# A column left of the line numbers marking folds (ui.fold.column): ▸ a
# closed one, ▾ where one starts, │ the lines inside it; with the mouse,
# clicking ▸ or ▾ opens or closes it. "auto" (shown with VS Code's keys,
# not Vim's), "on" or "off".
fold-column = "auto"
# The width gq and gw reflow text to (per buffer with :setlocal tw=72).
text-width = 79
# Typing past text-width breaks the line, keeping its indentation and
# comment marker: "off", "comments" (only in comments, for code) or "all"
# (for prose). Per language: options = { auto-wrap = "all" }.
auto-wrap = "off"
# Where gf looks for the file named under the cursor: directories separated
# by commas, as Vim's 'path'. "." is the current file's directory, an empty
# entry (the ",," here) the working directory, "**" any depth below
# ("src/**"), and ";" after one also searches above it (".;"). A name
# starting with ./ or ../ is only looked for beside the file.
path = ".,,"
# Endings gf also tries after the name, as Vim's 'suffixesadd': ".rs" finds
# util.rs from "util". Per language: options = { suffixes-add = ".py" }.
suffixes-add = ""
# Have the language server format the file before each save (as :format
# does), waiting up to 2 seconds for it. Per language:
# [languages.rust] options = { format-on-save = true }.
format-on-save = false
# A program gq runs its lines through, given them on its input and taking
# what it prints in their place, as Vim's 'formatprg': "fmt -w 72", "par",
# "jq .". It runs in the shell (see shell below) and gets 5 seconds; if it
# fails the lines stay as they were. A language server that formats part of
# a file comes first (as in Neovim), and gw always reflows. "" reflows to
# text-width. Per language: options = { format-program = "jq ." }.
format-program = ""
# Long lines continue on the next screen rows, breaking between words, and
# gj/gk move by screen rows. false scrolls sideways instead.
wrap = true
# A wrapped line's later rows start at its indentation.
wrap-indent = true
# What a wrapped line's later rows start with ("" for nothing).
wrap-marker = "↪ "
# Highlight the line the cursor is on.
cursorline = true
# Faint lines at each level of indentation (the block the cursor's in a
# little brighter), as VS Code draws them.
indent-guides = true
# Brackets coloured by how deeply they're nested, in three colours that go
# round (ui.bracket.1 to .3); those in strings and comments aren't.
bracket-colors = true
# With the cursor on a bracket (or just after one, typing), it and its pair
# are highlighted (ui.bracket.match).
match-brackets = true
# "global": one status bar along the bottom of the screen, as VS Code's.
# "windows": a status line under every window, the active one highlighted
# (Neovim's default).
statusline = "global"
# How the status line looks: "vscode" (a coloured bar: Ln 12, Col 4,
# Spaces: 4, UTF-8, the language's name, errors and warnings always shown)
# or "classic" (12:4, only what's unusual).
statusline-style = "vscode"
# Minimum lines kept visible above/below the cursor when scrolling.
scroll-off = 5
# Show git changes: bars in the gutter for added, changed and removed lines
# (against what's staged, as VS Code does), ]c and [c to jump between them,
# and the branch in the status line ("git" in statusline-layout).
git = true
# Show who last changed the cursor's line, and when, after it in grey, once
# the cursor rests there in normal mode (:git_blame turns it on and off).
git-blame = true
# Use the mouse: click to move the cursor or focus a window, the sidebar or
# the terminal panel; drag to select; scroll with the wheel. To select text
# with the terminal's own selection instead, hold Shift while dragging
# (Option in iTerm2 and Terminal.app), or set this to false.
mouse = true
# Rest the pointer on a word to see what the language server says about it
# (its type, its docs) and any problem there, as VS Code's hover. Moving
# off it, a key or a click closes it; the wheel over it scrolls it.
mouse-hover = true
# Milliseconds the pointer rests before the hover shows.
mouse-hover-delay = 500
# Columns the sidebar's file tree (<Space>e, :explorer) takes, left of the
# windows. It never takes more than half the screen.
sidebar-width = 30
# While it's shown, the file tree follows buffer switches: it opens the
# folders down to the file switched to and selects it, leaving focus where
# it is (as VS Code's explorer.autoReveal).
tree-follows-buffer = true
# The menu bar along the top: File, Edit, View, Go, Git, Terminal, Help
# (F10, or Alt/⌥ and a menu's letter, or a click).
menu-bar = true
# The activity bar: a column of icons down the left, always there, that
# shows the sidebar's views (click one; click the shown one to hide the
# sidebar) and opens the settings.
activity-bar = true
# A tab for each open buffer along the top of the windows, as VS Code's:
# click one to show it, its × (or a middle click) to close it; ● marks
# unsaved changes.
tab-bar = true
# Above the text, the file's path and the symbols the cursor is in (from a
# language server), as VS Code's breadcrumbs: click a symbol to go to it, a
# folder to show it in the sidebar.
breadcrumbs = true
# Started in a folder with no files named, open the files that were open
# when ferra last quit there (with their cursors, the one shown, and the
# sidebar if it was open).
restore-session = true
# Icons: "plain" (symbols every font has) or "nerd", for a Nerd Font
# (https://www.nerdfonts.com): VS Code's own icons in the activity bar and
# status bar, and file and folder icons in the file tree and the picker.
icons = "plain"
# The colour theme: "ferra-dark" (ferra's own), or one from an installed
# theme pack (:theme picks one, showing each as you go; :plugin_browse
# theme lists the plugin directory's). Your [theme] goes over it.
color-theme = "ferra-dark"
# Rows the terminal panel (<Space>t, :terminal) takes, under the windows.
terminal-height = 12
# Columns the terminal panel's list of shells takes, down its right side
# once there are two or more (at most half the panel; drag its line to
# change it).
terminal-list-width = 22
# The terminal panel's shell, and format-program's. "" runs $SHELL (or
# /bin/sh).
shell = ""
# What ending a terminal (closing it, or quitting ferra) does to what its
# shell started: "kill" ends everything it started, even what ignores the
# hangup (nohup); "hangup" hangs up, as closing a terminal app's window
# does, and what ignores it keeps running.
terminal-close = "kill"
# Pass a terminal panel program's bell on to the terminal ferra runs in,
# which then does what it does with a bell (a sound, a flash, a mark on the
# tab). Off, as Neovim's belloff=all.
terminal-bell = false
# The coding agent :agent talks to: one of the [agents] below.
agent = "claude"
# Columns the agent sidebar (Ctrl+Alt+B, :agent) takes, right of the
# windows. It never takes more than half the screen.
agent-width = 50
# Each message to the agent says what you're looking at: the file and
# where the cursor is, what's selected, the other files open.
agent-context = true
# The plugin directory :plugin_browse lists: a git repository with an
# index.toml (owner/repo on GitHub, or any git URL or path).
plugin-index = "JonWatkins/ferra-plugins"
# Opening a file ferra has no language for offers to install the plugin
# directory's language pack for it, if it has one.
plugin-suggestions = true
# Colour code with tree-sitter (the languages in [languages] below).
syntax-highlighting = true
# Ask the terminal for the kitty keyboard protocol where it has it (kitty,
# WezTerm, foot, Ghostty, Alacritty, recent iTerm2). Keys then arrive
# unambiguously: a quick Esc then j is never taken for a bound <A-j>, and
# <C-i>, <C-m> can be bound apart from <Tab>, <CR> (unbound, they act as
# those; <C-[> is always <Esc>). Other terminals work as before.
kitty-keyboard = true
# Milliseconds to wait for the next key of a sequence before giving up: a
# half-typed insert-mode binding (the j of jk) is typed as text, and a key
# bound on its own and as a prefix (g and gg) runs the shorter binding.
# 0 waits forever.
key-timeout = 1000
# The system clipboard: "registers" (only "+ and "* use it), "unnamed"
# (every yank and delete goes to it, and p pastes from it) or "off".
clipboard = "registers"
# Which clipboard that is: "system", "terminal" (your terminal's, set with
# an OSC 52 escape sequence: it works over SSH, and in tmux with
# `set -g set-clipboard on`) or "auto" (the system clipboard, but the
# terminal's over SSH or when there's no system clipboard). The terminal's
# clipboard can only be copied to; paste from it with your terminal.
clipboard-provider = "auto"
# The encoding for files that aren't UTF-8 and have no byte-order mark (any
# WHATWG label: "windows-1252", "latin1", "shift_jis", "gbk"...). Files are
# saved back in the encoding they were read in. "utf-8" refuses other files.
fallback-encoding = "windows-1252"
# Start the language server set for a file's language (language-server in
# [languages] below) when it's opened: diagnostics in the text, ]d and [d,
# K, gd, gr and completion.
lsp = true
# In insert mode, show the language server's completions as you type (two
# letters of a word, or after `.` and the like). <C-n> and <C-p> choose,
# <Tab> or <C-y> takes one, typing on ignores them. Off: only on
# <C-Space> or <C-x><C-o>.
auto-complete = true
# Resting the cursor on a symbol in normal mode highlights its other uses
# in view, from the language server.
highlight-references = true
# Show the language server's inlay hints in the text, in grey: variables'
# types, parameters' names (rust-analyzer, TypeScript...). :inlay_hints
# turns them on and off.
inlay-hints = true
# Check open files for changes made by other programs (a formatter, git, a
# tool editing alongside you) every second while you're idle in normal mode,
# not only when the terminal regains focus. Unmodified buffers reload (u
# brings back what was there); modified ones get a warning.
watch-files = true

# What the active window's status line shows, left, center and right.
# Elements: mode, file-name, file-base-name, modified, position,
# position-percentage, total-lines, file-type, file-encoding (only when not
# plain UTF-8), file-line-ending, indent ("2 spaces", "tabs"), diagnostics
# (language server errors and warnings: E2 W1), lsp-progress (what a
# language server is busy with: "rust-analyzer: Indexing 45%"),
# pending-keys, recording, separator, spacer.
[editor.statusline-layout]
left = ["mode", "git", "diagnostics", "file-name", "modified"]
center = []
right = ["recording", "pending-keys", "lsp-progress", "position", "indent", "file-encoding", "file-line-ending", "file-type"]

[editor.search]
# "smart" (case-insensitive unless the pattern has a capital), "sensitive"
# or "insensitive".
case = "smart"
# Keep matches of the last search highlighted, until :noh.
highlight = true
# Searches wrap around the end of the file.
wrap = true

# <Space>f lists files under the current directory.
[editor.file-picker]
# List hidden files (names starting with a dot) too.
hidden = false
# Leave out files git ignores (.gitignore and the like).
git-ignore = true
# Stop listing after this many files, in a very large directory.
max-files = 20000

# The cursor's shape in each mode: "block", "bar" or "underline".
[editor.cursor-shape]
normal = "block"
insert = "bar"
command = "bar"
picker = "bar"
sidebar = "block"
find = "bar"
terminal = "block"
popup = "block"
input = "bar"
git = "block"
# While an operator (d, c, y) waits for a motion.
operator = "underline"
visual = "block"
# Replace mode (R).
replace = "underline"

# Coding agents, for :agent: each is its own program speaking ACP (the Agent
# Client Protocol), started in the project's folder. They aren't installed
# for you, and each has its own login. Claude Code:
#
#   npm install -g @agentclientprotocol/claude-agent-acp
#
# (With Node from pnpm, use `pnpm add -g` instead, so the command lands on
# your PATH.)
#
# Add others the same way (a command, its arguments, environment variables):
#
#   [agents.gemini]          # npm install -g @google/gemini-cli
#   command = "gemini"
#   args = ["--acp"]

[agents.claude]
command = "claude-agent-acp"

# Which files are in which language, for syntax highlighting. Files are
# matched by exact file name, then extension, then the interpreter on a
# `#!` first line (`python` also matches `python3.12`). Add your own:
#
#   [languages.bash]
#   file-names = [".bashrc", "my-script"]
#
# `comment` (or `block-comment` for languages without line comments) is what
# gc uses to comment lines out. `options` sets tab-width, expand-tab,
# auto-indent, text-width, auto-wrap, format-on-save, format-program, path or
# suffixes-add for the language's buffers (:setlocal still wins):
#
#   [languages.python]
#   options = { tab-width = 4, text-width = 88 }
#
# Most languages come from language packs (:plugin_browse; opening a file of
# a type ferra doesn't know offers its pack). Settings for them go here the
# same way, and win over the pack's. A language without a grammar (make,
# git-commit) isn't highlighted, but is still recognised for comments and
# options.
#
# `language-server` is the language server for its files: a command found on
# PATH, its arguments, and the files that mark a project's root (the nearest
# one above the file; otherwise its own directory). Servers aren't installed
# for you: one that isn't found is reported once, and :lsp lists them all.
# `settings` are the server's own settings, sent as it starts. Turn one off
# with `language-server = { enabled = false }`.

[languages.toml]
extensions = ["toml"]
file-names = ["Cargo.lock", "Pipfile"]
comment = "#"
language-server = { command = "taplo", args = ["lsp", "stdio"] }

[languages.json]
extensions = ["json", "jsonc"]
file-names = [".prettierrc", ".eslintrc"]
language-server = { command = "vscode-json-language-server", args = ["--stdio"], settings = { json = { validate = { enable = true } } } }

[languages.make]
extensions = ["mk"]
file-names = ["Makefile", "makefile", "GNUmakefile"]
comment = "#"
# Recipes must start with a tab.
options = { expand-tab = false }

[languages.git-commit]
file-names = ["COMMIT_EDITMSG", "MERGE_MSG", "TAG_EDITMSG"]
comment = "#"
options = { text-width = 72, auto-wrap = "all" }

[languages.bash]
extensions = ["sh", "bash", "zsh"]
file-names = [".bashrc", ".bash_profile", ".bash_aliases", ".profile", ".zshrc", ".zprofile", ".zshenv", "PKGBUILD"]
shebangs = ["sh", "bash", "zsh", "dash"]
comment = "#"
language-server = { command = "bash-language-server", args = ["start"], language-id = "shellscript" }

[languages.markdown]
extensions = ["md", "markdown"]
block-comment = ["<!--", "-->"]
language-server = { command = "marksman", args = ["server"] }

[languages.yaml]
extensions = ["yaml", "yml"]
file-names = [".clang-format"]
comment = "#"
language-server = { command = "yaml-language-server", args = ["--stdio"] }

# Theme styles are keyed by scope. Lookups fall back to the parent scope, so
# "ui.linenr.selected" falls back to "ui.linenr".
#
# A style is either a foreground colour string, or a table with optional
# `fg`, `bg` and `modifiers` (bold, italic, dim, underlined, reversed, crossed_out).
# Colours may be hex ("#rrggbb"), names ("red", "lightblue") or indices ("42").
[theme]
"ui.background" = { bg = "#16181d" }
"ui.text" = "#d4d7dd"
"ui.cursorline" = { bg = "#1f2229" }
"ui.selection" = { bg = "#33467c" }
"ui.search.match" = { fg = "#16181d", bg = "#e0af68" }
# The match the cursor's on while the find box (<Space>/) has focus.
"ui.search.current" = { fg = "#16181d", bg = "#ff9e64", modifiers = ["bold"] }
# The other uses of the symbol under the cursor (a language server's).
"ui.highlight.reference" = { bg = "#2c3242" }

# Syntax highlighting. Scopes fall back to their parent, so "function.method"
# uses "function" unless it's set itself.
"keyword" = "#bb9af7"
"function" = "#7aa2f7"
"function.macro" = "#7dcfff"
"type" = "#2ac3de"
"constructor" = "#2ac3de"
"module" = "#7aa2f7"
"string" = "#9ece6a"
"escape" = "#7dcfff"
"comment" = { fg = "#565f89", modifiers = ["italic"] }
"constant" = "#ff9e64"
"number" = "#ff9e64"
"boolean" = "#ff9e64"
"variable.builtin" = "#f7768e"
"variable.parameter" = "#e0af68"
"property" = "#73daca"
"attribute" = "#e0af68"
"label" = "#7dcfff"
"tag" = "#f7768e"
"operator" = "#89ddff"
"punctuation" = "#9aa5ce"
# Markdown and other prose.
"text.title" = { fg = "#7aa2f7", modifiers = ["bold"] }
"text.strong" = { modifiers = ["bold"] }
"text.emphasis" = { modifiers = ["italic"] }
"text.literal" = "#9ece6a"
"text.uri" = { fg = "#7dcfff", modifiers = ["underlined"] }
"text.reference" = "#7dcfff"
"ui.window.separator" = "#3b4048"
# Virtual text: a language server's inlay hints (types, parameter names).
"ui.virtual.inlay-hint" = { fg = "#6b7280", modifiers = ["italic"] }
"ui.virtual.inlay-hint.type" = { fg = "#6b7280", modifiers = ["italic"] }
"ui.virtual.inlay-hint.parameter" = { fg = "#6b7280", modifiers = ["italic"] }
# For plugins' decorations (ctx:decorate): backgrounds for problems, and
# text after or inside lines. Any other scope works too ("comment"...).
"ui.decoration.error" = { bg = "#4a2530" }
"ui.decoration.warning" = { bg = "#4a3e25" }
"ui.decoration.info" = { bg = "#253447" }
"ui.decoration.text" = { fg = "#6b7280", modifiers = ["italic"] }
# Git blame for the cursor's line, after it.
"ui.virtual.blame" = { fg = "#565f89", modifiers = ["italic"] }
"ui.virtual.conflict" = { fg = "#7a88b8", modifiers = ["italic"] }
# Merge conflicts in the text: each side's rows, and the marker lines.
"ui.conflict.ours" = { bg = "#1f3a3a" }
"ui.conflict.theirs" = { bg = "#1f2a4a" }
"ui.conflict.base" = { bg = "#2a2a2a" }
"ui.conflict.marker" = { fg = "#a9b1d6", bg = "#2b3047", modifiers = ["bold"] }
# Git changes in the gutter (against what's staged).
"ui.gutter.added" = "#9ece6a"
"ui.gutter.changed" = "#7aa2f7"
"ui.gutter.removed" = "#f7768e"
# The status bar (statusline-style = "vscode"): its colour, and the text
# on it.
"ui.statusbar" = { fg = "#e6e9f5", bg = "#3d59a1" }
# The activity bar down the left: its icons, the shown view's, and the mark
# beside that.
"ui.activitybar" = { fg = "#6b7280", bg = "#16181d" }
"ui.activitybar.active" = { fg = "#c0caf5", bg = "#24283b", modifiers = ["bold"] }
"ui.activitybar.marker" = { fg = "#7aa2f7", bg = "#24283b" }
# The sidebar's file tree (<Space>e).
"ui.sidebar" = { fg = "#a9b1d6", bg = "#1a1c22" }
"ui.sidebar.title" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.sidebar.marker" = "#6b7280"
# Folders' icons (icons = "nerd"; files' are coloured by their type).
"ui.sidebar.folder.icon" = "#7aa2f7"
"ui.sidebar.folder" = "#c0caf5"
"ui.sidebar.file" = "#a9b1d6"
"ui.sidebar.current" = { fg = "#7dcfff", modifiers = ["bold"] }
"ui.sidebar.selected" = { bg = "#33467c" }
"ui.sidebar.modified" = "#e0af68"
"ui.sidebar.empty" = { fg = "#6b7280", modifiers = ["italic"] }
# The Search view: its files' names, the matching lines, what matched in
# them, and each file's count.
"ui.sidebar.search.file" = { fg = "#c0caf5", modifiers = ["bold"] }
"ui.sidebar.search.line" = "#8c93ad"
"ui.sidebar.search.match" = { fg = "#ffc777", bg = "#3a3324", modifiers = ["bold"] }
"ui.sidebar.search.count" = { fg = "#c0caf5", bg = "#3b4048" }
# The replace preview: what goes, and what takes its place.
"ui.sidebar.search.removed" = { fg = "#f7768e", bg = "#3b2228", modifiers = ["crossed_out"] }
"ui.sidebar.search.added" = { fg = "#9ece6a", bg = "#24332a", modifiers = ["bold"] }
# Git in the sidebar: the file tree's names and letters, and Source Control.
"ui.sidebar.git.modified" = "#e0af68"
"ui.sidebar.git.added" = "#9ece6a"
"ui.sidebar.git.deleted" = "#f7768e"
"ui.sidebar.git.renamed" = "#7dcfff"
"ui.sidebar.git.conflict" = { fg = "#f7768e", modifiers = ["bold"] }
"ui.sidebar.git.folder" = "#c8a96e"
"ui.sidebar.git.header" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.sidebar.git.branch" = "#6b7280"
# Files with errors or warnings in the file tree, and the folders they're in
# (over git's colours).
"ui.sidebar.diagnostic.error" = "#f7768e"
"ui.sidebar.diagnostic.warning" = "#e0af68"
# The agent sidebar (Ctrl+Alt+B, :agent), right of the windows: its header
# (the agent, its mode), the chat, the agent's question and its box.
"ui.sidebar.agent.header" = { bg = "#1f2229" }
"ui.sidebar.agent.title" = { fg = "#7aa2f7", bg = "#1f2229", modifiers = ["bold"] }
"ui.sidebar.agent.mode" = { fg = "#c0caf5", bg = "#33467c" }
"ui.sidebar.agent.busy" = { fg = "#e0af68", bg = "#1f2229" }
"ui.sidebar.agent.user" = { fg = "#c0caf5", bg = "#24283b" }
"ui.sidebar.agent.user.mark" = { fg = "#7aa2f7", bg = "#24283b", modifiers = ["bold"] }
"ui.sidebar.agent.text" = "#c0caf5"
"ui.sidebar.agent.bold" = { fg = "#c0caf5", modifiers = ["bold"] }
"ui.sidebar.agent.heading" = { fg = "#7aa2f7", modifiers = ["bold"] }
"ui.sidebar.agent.bullet" = "#7aa2f7"
"ui.sidebar.agent.code" = "#9ece6a"
"ui.sidebar.agent.code.inline" = { fg = "#7dcfff", bg = "#24283b" }
"ui.sidebar.agent.thought" = { fg = "#6b7280", modifiers = ["italic"] }
"ui.sidebar.agent.notice" = { fg = "#6b7280", modifiers = ["italic"] }
"ui.sidebar.agent.tool" = "#a9b1d6"
"ui.sidebar.agent.tool.pending" = "#6b7280"
"ui.sidebar.agent.tool.running" = "#e0af68"
"ui.sidebar.agent.tool.done" = "#9ece6a"
"ui.sidebar.agent.tool.failed" = "#f7768e"
"ui.sidebar.agent.output" = "#8c93ad"
"ui.sidebar.agent.added" = "#9ece6a"
"ui.sidebar.agent.removed" = "#f7768e"
